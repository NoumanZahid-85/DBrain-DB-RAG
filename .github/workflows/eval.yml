name: RAG Pipeline Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-and-api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run hermetic unit + API tests
        run: |
          python -m pytest tests/ -q

      - name: Verify backend boots (import path regression guard)
        run: |
          python -c "import backend.main; print('uvicorn backend.main:app OK')"

  ragas-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit-and-api-tests
    if: always() && needs.unit-and-api-tests.result == 'success'

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      EMBEDDING_PROVIDER: local
      CHROMA_PERSIST_DIR: ./chroma_db_local
      EVAL_LIMIT: "3"
      USE_OLLAMA: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild retrieval index (local MiniLM, no API key required)
        run: python scripts/reindex.py

      - name: Run RAGAS quality gate
        run: python eval/run_eval.py

  smoke-query-on-render:
    runs-on: ubuntu-latest
    needs: unit-and-api-tests
    if: always() && needs.unit-and-api-tests.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify render.yaml start command boots the app
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EMBEDDING_PROVIDER: local
        run: |
          python -c "import backend.main; print('startCommand module import OK')"