name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Hermetic unit + API tests
        run: python -m pytest tests/ -q

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          CI: "true"  # warnings fail the build

  docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build the lean production image (what Render free runs)
        run: docker build --build-arg RERANKER_ENABLED=false -t dbrain:ci .
      - name: Boot it and hit /health and the UI
        run: |
          docker run -d --name dbrain -p 8000:8000 dbrain:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break; sleep 2; done
          curl -fs localhost:8000/health
          curl -fs localhost:8000/ | grep -q '<div id="root">'
          curl -fs localhost:8000/api/v1/status

  ragas-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: backend-tests
    if: github.event_name == 'push'
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      EVAL_LIMIT: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Build retrieval index (local MiniLM, no API key)
        run: python scripts/reindex.py
      - name: RAGAS quality gate
        run: python eval/run_eval.py
