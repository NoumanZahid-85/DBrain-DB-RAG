# Production-like local run: API + UI on http://localhost:8000
#   docker compose up --build
services:
  dbrain:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - dbrain-data:/app/data/state   # chat history + audit log survive restarts
    restart: unless-stopped

volumes:
  dbrain-data:
