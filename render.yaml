# One Docker web service: API + UI on the same origin.
# The index is built into the image, so no persistent disk is needed.
# SQLite chat history is ephemeral on the free plan (resets on redeploy).
services:
  - type: web
    name: dbrain-db-rag
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      # Free plan has 512MB RAM: skip torch. Set true on a 2GB+ instance.
      - key: RERANKER_ENABLED
        value: "false"
      - key: RATE_LIMIT_PER_MINUTE
        value: "15"
      - key: API_KEY
        generateValue: true
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_HOST
        value: https://cloud.langfuse.com
